
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>The Coarse Curse RSS Feed </title>

  <link rel="icon" type="image/png" href="./favicon.png">

  <meta name="theme-color" content="#24212b">
  <meta name="description" content="Follow announcements and development updates from The Coarse Curse.">
  
<!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Shrikhand&family=Tilt+Warp&family=Lexend&display=swap" rel="stylesheet">

  <!-- RSS Auto Discovery-->
<link   rel="alternate"  type="application/rss+xml"  title="The Coarse Curse - Status Updates"  href="./rss.xml" >
  
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #3b3e4d;
      color: #A67D71;
      font-family: 'Poppins', sans-serif;
    }

    .container {
      width: 100%;
      max-width: 540px;
      text-align: center;
      padding: 48px 32px;
      border: 1px solid #514858;
      border-radius: 6px;
      background: #24283A;
      box-shadow: 0 16px 50px #00000035;
    }

    .ornament {
      color: #F7D6BF;
      font-size: 28px;
      margin-bottom: 20px;
    }

    .eyebrow {
      color: #A67D71;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    h1 {
      margin: 14px 0 10px;
      color: #F7D6BF;
      font-family: 'Shrikhand', cursive;
      font-size: clamp(27px, 6vw, 42px);
      font-weight: normal;
      letter-spacing: 0;
       line-height: 1;
    }

    .subtitle {
      color: #A67D71;
      font-size: 14px;
      line-height: 1;
      margin: 0 auto;
      max-width: 380px;
    }

    .divider {
      width: 48px;
      height: 1px;
      background: #A67D71;
      margin: 30px auto;
    }

    .rss-button {
      display: inline-block;
      padding: 13px 25px;
      border-radius: 15px;
      background: #D98D7F;
      color: #5C556F;
      text-decoration: none;
      font-family: 'Tilt Warp', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1px;
      transition: background 0.2s, transform 0.2s ease;
    }
    
    .rss-button.copied {
      background-color: #0F1119;
      color: #F7D6BF
    }

    .rss-button:hover {
            transform: scale(1.10);
    }

    .note {
      color: #A67D71;
      font-size: 11px;
      line-height: 1;
      margin-top: 22px;
    }
    .return-button {
      display: inline-block;
      padding: 12px 24px;
      background-color: #1C2133;
      color: #AD9595;
      font-family: 'Lexend';
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      border: 0px solid #A67D71;
      transition: transform 0.25s ease, background-color 0.2s, color 0.2s;
    }    
.return-button:hover {
  transform: scale(1.10);
}
    footer {
      margin-top: 42px;
      color: #A67D71;
      font-size: 11px;
    }

    footer a {
      color: #F7D6BF;
      text-decoration: none;
      font-size: 14px;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <main class="container">

    <div class="ornament">🦀</div>

    <div class="eyebrow">Updates on the current state of The Coarse Curse series.</div>

    <h1>The Coarse Curse RSS Feed</h1>

     

    <button class="rss-button" onclick="copyRSSLink()">
  COPY RSS LINK
</button>

<script>
  function copyRSSLink() {
    const rssURL = "https://kerzid.github.io/tcc-status/rss.xml";
    const button = document.querySelector(".rss-button");

    navigator.clipboard.writeText(rssURL).then(() => {
      const originalText = button.textContent;

      button.textContent = "RSS LINK COPIED!";
      button.classList.add("copied");

      setTimeout(() => {
        button.textContent = originalText;
        button.classList.remove("copied");
      }, 2000);
    }).catch(() => {
      prompt("Copy the RSS feed link:", rssURL);
    });
  }
</script>

<div class="divider"></div>
    <footer>
      <a href="https://thecoarsecurse.crd.co/" class="return-button">
        Return to The Coarse Curse Directory
      </a>
    
     
    </footer>

  </main>
</body>
</html>
